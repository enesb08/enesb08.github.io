<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EbMobile mobil uygulamaları ve oyunları.">
  <title>EbMobile</title>
  <style>
    :root { --ink:#111b44; --purple:#6150e8; --mist:#edf9ff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); background:#f5f8ff; font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .page { width:min(1040px,calc(100% - 48px)); margin:auto; }
    header { display:flex; align-items:center; justify-content:space-between; padding:28px 0; }
    .brand { display:flex; align-items:center; gap:10px; color:inherit; font-size:1.2rem; font-weight:850; letter-spacing:-.03em; text-decoration:none; }
    .brand img { width:48px; height:48px; object-fit:contain; }
    .privacy { color:#506087; font-weight:700; text-decoration:none; }
    main { padding:32px 0 72px; }
    .intro { padding:clamp(28px,5vw,52px); border-radius:28px; color:#fff; background:linear-gradient(135deg,#161e4b,#5140bd); box-shadow:0 20px 42px rgba(30,38,104,.18); }
    h1 { margin:0; font-size:clamp(2.8rem,6vw,4.8rem); line-height:.94; letter-spacing:-.065em; }
    .intro-copy { max-width:480px; margin:17px 0 0; color:#e5e2ff; font-size:1.05rem; }
    .intro-cta { display:inline-flex; margin-top:8px; color:#fff; font-weight:800; text-decoration:none; }
    .intro-cta:hover,.intro-cta:focus-visible { text-decoration:underline; }
    h2 { margin:34px 0 16px; font-size:1.05rem; letter-spacing:-.02em; }
    .apps { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,380px)); gap:20px; }
    .app { display:flex; gap:20px; align-items:center; padding:18px; border:1px solid #dcecff; border-radius:22px; background:#fff; box-shadow:0 12px 24px rgba(48,101,160,.09); color:inherit; text-decoration:none; transition:transform .18s ease,box-shadow .18s ease; }
    .app:hover,.app:focus-visible { transform:translateY(-4px); box-shadow:0 20px 34px rgba(48,101,160,.15); outline:none; }
    .app img { width:76px; height:76px; flex:none; border-radius:17px; object-fit:cover; }
    .app h3 { margin:0 0 5px; font-size:1.3rem; letter-spacing:-.035em; }.app p { margin:0; color:#66748d; font-size:.93rem; }
    footer { padding:28px 0 40px; color:#71809a; font-size:.9rem; } footer a { color:inherit; text-decoration:none; } footer a:hover,footer a:focus-visible { text-decoration:underline; }
    @media (max-width:560px) { .page { width:min(100% - 36px,520px); } header { padding-top:20px; } }
  </style>
</head>
<body>
  <div class="page">
    <header><a class="brand" href="index.html" aria-label="EbMobile ana sayfa"><img src="assets/profile-icon-rebuilt-phone-play-512.png" alt="">EbMobile</a><a class="privacy" href="privacy-policy/index.html">Gizlilik bildirimi</a></header>
    <main>
      <section class="intro" aria-labelledby="intro-title"><h1 id="intro-title">EbMobile</h1><p class="intro-copy">Keyifle oynanacak mobil deneyimler tasarlıyoruz.<br><a class="intro-cta" href="https://play.google.com/store/apps/dev?id=8865251460924613045" target="_blank" rel="noopener noreferrer">Mobil Evrenimize Siz de Katılın →</a></p></section>
      <section aria-labelledby="apps-title">
        <h2 id="apps-title">Uygulamalar</h2>
        <div class="apps"><a class="app" href="last-rung/index.html"><img src="assets/last-rung-cover.png" alt="Last Rung oyun kapağı"><div><h3>Last Rung</h3><p>Zamanlamanı yakala, tuzaklardan kaç ve zirveye ulaş.</p></div></a></div>
      </section>
    </main>
    <footer><a href="https://play.google.com/store/apps/dev?id=8865251460924613045" target="_blank" rel="noopener noreferrer">© 2026 EbMobile</a></footer>
  </div>
</body>
</html>
